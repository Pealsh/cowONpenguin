<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Field Prototype</title>
<style>
  :root { --fg:#d8e6d0; --dim:#7f9378; --bg:#050806; --accent:#f2f5e8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; left:16px; top:14px; pointer-events:none; line-height:1.4; }
  #hud h1 { margin:0; font-size:15px; letter-spacing:.15em; color:var(--accent); }
  #hud p { margin:2px 0 0; font-size:12px; color:var(--dim); }
  #skip { position:fixed; right:16px; top:14px; background:transparent; color:var(--fg);
    border:1px solid var(--dim); padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; }
  #skip:hover { border-color:var(--accent); color:var(--accent); }
  .label { position:fixed; transform:translate(-50%,-100%); font-size:12px; letter-spacing:.2em;
    color:var(--accent); pointer-events:none; white-space:nowrap; text-shadow:0 0 6px #000; }
  #panel { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); width:min(560px, calc(100% - 32px));
    background:rgba(5,8,6,.88); border:1px solid var(--dim); padding:16px 18px; opacity:0;
    transition:opacity .25s, transform .25s; pointer-events:none; }
  #panel.open { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  #panel h2 { margin:0 0 8px; font-size:14px; letter-spacing:.2em; color:var(--accent); }
  #panel p { margin:0; font-size:13px; line-height:1.7; }
  #flat { position:fixed; inset:0; background:var(--bg); overflow:auto; padding:56px 16px; display:none; }
  #flat.open { display:block; }
  #flat section { max-width:640px; margin:0 auto 32px; }
  #flat h2 { font-size:14px; letter-spacing:.2em; color:var(--accent); }
</style>
</head>
<body>
<div id="hud">
  <h1>YOUR NAME</h1>
  <p>WASD / 矢印 / ドラッグで移動 ・ 石碑に近づくと開く ・ T で ASCII 切替 ・ P で乗り換え</p>
</div>
<button id="skip">普通に見る</button>
<div id="panel"><h2></h2><p></p></div>
<div id="flat"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- コンテンツ（ダミー） ----------
const SPOTS = [
  { key:'WORKS',   pos:[ 10, -8], text:'制作物A / 制作物B / 制作物C — ここに作品カードが並ぶ想定。' },
  { key:'ABOUT',   pos:[-11, -6], text:'自己紹介テキスト。どんな人で、何が好きで、何を作ってきたか。' },
  { key:'SKILLS',  pos:[ -6, 12], text:'TypeScript / Three.js / GLSL / Figma ... 使える技術一覧。' },
  { key:'CONTACT', pos:[ 12, 10], text:'mail@example.com / GitHub / X — 連絡先リンク。' },
];

// ---------- 基本セットアップ ----------
const renderer = new THREE.WebGLRenderer({ antialias:false });
const DPR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020302);
scene.fog = new THREE.Fog(0x020302, 18, 45);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xcfe0c8, 0x101410, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(-8, 14, 6);
scene.add(sun);

// 地面
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshLambertMaterial({ color:0x1a2a1a }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ---------- 草（毛のように流れる細い葉） ----------
const BLADES = 110000, FIELD = 70;
const SEG = 4;
const bladeGeo = new THREE.InstancedBufferGeometry();
{
  const pos = [], idx = [];
  for (let i=0;i<=SEG;i++){
    const h = i/SEG, w = 0.08*(1-h*0.85);
    pos.push(-w,h,0,  w,h,0);
  }
  for (let i=0;i<SEG;i++){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  bladeGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  bladeGeo.setIndex(idx);
  const off = new Float32Array(BLADES*3), prm = new Float32Array(BLADES*3);
  for (let i=0;i<BLADES;i++){
    off[i*3]   = (Math.random()-0.5)*FIELD;
    off[i*3+2] = (Math.random()-0.5)*FIELD;
    prm[i*3]   = 0.45 + Math.random()*0.55;      // 長さ
    prm[i*3+1] = Math.random()*Math.PI*2;      // 向き
    prm[i*3+2] = Math.random();                // 明るさのばらつき
  }
  bladeGeo.setAttribute('offset', new THREE.InstancedBufferAttribute(off,3));
  bladeGeo.setAttribute('params', new THREE.InstancedBufferAttribute(prm,3));
  bladeGeo.instanceCount = BLADES;
}
const grassMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: { uTime:{value:0}, uPlayer:{value:new THREE.Vector3()},
              fogColor:{value:scene.fog.color}, fogNear:{value:scene.fog.near}, fogFar:{value:scene.fog.far} },
  vertexShader: /* glsl */`
    attribute vec3 offset; attribute vec3 params;
    uniform float uTime; uniform vec3 uPlayer;
    varying float vH; varying float vR; varying float vDepth;
    void main(){
      float h = position.y;
      vec3 p = position; p.y *= params.x;
      float c = cos(params.y), s = sin(params.y);
      p.xz = vec2(c*p.x - s*p.z, s*p.x + c*p.z);
      // 櫛でとかしたような流れ（場所で向きが変わる）
      float flowA = sin(offset.x*0.08)*1.6 + cos(offset.z*0.07)*1.6;
      vec2 bend = vec2(cos(flowA), sin(flowA)) * 0.9;
      // 風
      float wind = sin(uTime*1.2 + offset.x*0.12 + offset.z*0.09)*0.5 + sin(uTime*2.9 + offset.x*0.5)*0.15;
      bend += vec2(wind, wind*0.4);
      // プレイヤーが草をかき分ける
      vec2 d = offset.xz - uPlayer.xz; float dl = length(d);
      float push = smoothstep(2.4, 0.2, dl);
      bend = mix(bend, normalize(d + 1e-4) * 2.2, push);
      float k = h*h*params.x;
      vec3 w = offset + p;
      w.xz += bend * k;
      w.y -= length(bend) * k * 0.35;
      vH = h; vR = params.z;
      vec4 mv = viewMatrix * vec4(w,1.0);
      vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 fogColor; uniform float fogNear, fogFar;
    varying float vH; varying float vR; varying float vDepth;
    void main(){
      vec3 base = vec3(0.02,0.05,0.02), tip = vec3(0.45,0.7,0.42) * (0.6 + vR*1.0);
      vec3 col = mix(base, tip, pow(vH, 1.4));
      col = mix(col, fogColor, smoothstep(fogNear, fogFar, vDepth));
      gl_FragColor = vec4(col,1.0);
    }`
});
const grass = new THREE.Mesh(bladeGeo, grassMat);
grass.frustumCulled = false;
scene.add(grass);

// ---------- 牛とペンギン（なめらか版） ----------
const lam = (color, emissive=0) => new THREE.MeshLambertMaterial({ color, emissive });
const white = lam(0xf0f0e8, 0x2a2a26), black = lam(0x161616), pink = lam(0xd9a0a0, 0x201010);
const orange = lam(0xffa020, 0x402000), hornMat = lam(0xc8b89a);
// ホルスタイン柄テクスチャ（カプセルのUVに巻く）
const spotTex = (() => { const c=document.createElement('canvas'); c.width=512; c.height=256; const g=c.getContext('2d');
  g.fillStyle='#f0f0e8'; g.fillRect(0,0,512,256); g.fillStyle='#141414';
  for (let i=0;i<14;i++){ const x=Math.random()*512, y=40+Math.random()*176;
    for (let j=0;j<7;j++){ g.beginPath(); g.ellipse(x+(Math.random()-0.5)*60, y+(Math.random()-0.5)*40, 14+Math.random()*22, 10+Math.random()*16, Math.random()*3, 0, Math.PI*2); g.fill(); } }
  return new THREE.CanvasTexture(c); })();
const spotted = new THREE.MeshLambertMaterial({ map:spotTex, emissive:0x1a1a18 });

const box = (w,h,d,m,x,y,z) => { const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); return o; };
const mesh = (geo, mat, x=0, y=0, z=0) => { const o = new THREE.Mesh(geo, mat); o.position.set(x,y,z); return o; };
const capsule = (r, l) => new THREE.CapsuleGeometry(r, l, 10, 28);
const sphere = (r) => new THREE.SphereGeometry(r, 28, 20);

function makeCow(){
  const root = new THREE.Group();
  const body = mesh(capsule(0.42, 1.05), spotted, 0,1.35,0); body.rotation.x = Math.PI/2; body.scale.set(1.08,1,1); root.add(body);
  const neck = mesh(new THREE.CylinderGeometry(0.2,0.32,0.6,24), black, 0,1.58,0.9); neck.rotation.x = 0.9; root.add(neck);
  const head = mesh(capsule(0.2, 0.28), white, 0,1.7,1.28); head.rotation.x = Math.PI/2 + 0.35; root.add(head);
  const cap = mesh(sphere(0.21), black, 0,1.82,1.18); cap.scale.set(1.05,0.6,0.8); root.add(cap);
  const muzzle = mesh(sphere(0.18), pink, 0,1.53,1.5); muzzle.scale.set(1.05,0.8,0.85); root.add(muzzle);
  for (const sx of [-1,1]){
    const ear = mesh(sphere(0.1), black, sx*0.27,1.78,1.15); ear.scale.set(1.8,0.6,1); root.add(ear);
    const horn = mesh(new THREE.ConeGeometry(0.05,0.2,16), hornMat, sx*0.15,1.98,1.18); horn.rotation.z = -sx*0.6; root.add(horn);
    root.add(mesh(sphere(0.035), black, sx*0.17,1.76,1.36));    // 目
  }
  const udder = mesh(sphere(0.2), pink, 0,0.98,-0.45); udder.scale.set(1,0.6,1); root.add(udder);
  const tail = new THREE.Group(); tail.position.set(0,1.65,-1.0);
  tail.add(mesh(new THREE.CylinderGeometry(0.03,0.04,0.9,12), white, 0,-0.45,0));
  const tuft = mesh(sphere(0.08), white, 0,-0.95,0); tuft.scale.set(1,1.8,1); tail.add(tuft);
  root.add(tail);
  const legs = [];
  for (const [x,z] of [[-0.26,0.68],[0.26,0.68],[-0.26,-0.68],[0.26,-0.68]]){
    const hip = new THREE.Group(); hip.position.set(x,1.05,z);
    hip.add(mesh(new THREE.CylinderGeometry(0.13,0.09,0.9,20), white, 0,-0.45,0));
    hip.add(mesh(new THREE.CylinderGeometry(0.09,0.11,0.12,20), black, 0,-0.95,0));   // ひづめ
    root.add(hip); legs.push(hip);
  }
  return { root, legs, tail };
}

function makePenguin(){
  const root = new THREE.Group();
  // 卵型の胴を回転体で作り、頂点カラーで黒い背中・白いお腹・黄色い胸を塗り分ける
  const prof = [[0,0],[0.12,0.015],[0.19,0.08],[0.225,0.2],[0.24,0.35],[0.225,0.5],[0.19,0.63],[0.15,0.73],[0.11,0.8],[0,0.84]]
    .map(([r,y]) => new THREE.Vector2(r,y));
  const geo = new THREE.LatheGeometry(new THREE.SplineCurve(prof).getPoints(40), 40);
  const pos = geo.attributes.position, col = new Float32Array(pos.count*3), c = new THREE.Color();
  const B = new THREE.Color(0x181a1e), W = new THREE.Color(0xf2f2ea), Y = new THREE.Color(0xffc838);
  for (let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i), r=Math.hypot(x,z)||1;
    const front = THREE.MathUtils.smoothstep(z/r, -0.05, 0.35);
    c.copy(B).lerp(W, front);
    const chest = THREE.MathUtils.smoothstep(y, 0.55, 0.7) * THREE.MathUtils.smoothstep(z/r, 0.3, 0.6);
    c.lerp(Y, chest);
    col.set([c.r,c.g,c.b], i*3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  root.add(mesh(geo, new THREE.MeshLambertMaterial({ vertexColors:true, emissive:0x101010 })));
  const head = mesh(sphere(0.13), black, 0,0.9,0.02); head.scale.set(1,1,1.1); root.add(head);
  for (const sx of [-1,1]){
    const cheek = mesh(sphere(0.045), orange, sx*0.1,0.87,0.0); cheek.scale.set(0.5,1.4,1); root.add(cheek);
  }
  const beak = mesh(new THREE.ConeGeometry(0.03,0.2,16), orange, 0,0.88,0.22); beak.rotation.x = Math.PI/2; root.add(beak);
  const flippers = [], feet = [];
  for (const sx of [-1,1]){
    const pivot = new THREE.Group(); pivot.position.set(sx*0.21,0.62,0);
    const f = mesh(sphere(0.1), black, 0,-0.18,0); f.scale.set(0.25,2,0.7); pivot.add(f);
    root.add(pivot); flippers.push(pivot);
    const foot = mesh(sphere(0.06), orange, sx*0.08,0.015,0.06); foot.scale.set(1,0.35,1.6); root.add(foot); feet.push(foot);
  }
  return { root, flippers, feet };
}

const animCow = (c, g, k, t) => {
  c.legs.forEach((l,i) => l.rotation.x = Math.sin(g + (i%2 ? Math.PI : 0) + (i>1 ? Math.PI/2 : 0)) * 0.6 * k);
  c.tail.rotation.z = Math.sin(t*3) * 0.25;
};
const animPenguin = (p, g, k, t) => {
  p.root.rotation.z = Math.sin(g) * 0.12 * k;                  // よちよち
  p.feet.forEach((f,i) => f.position.z = 0.06 + Math.sin(g + i*Math.PI) * 0.07 * k);
  p.flippers.forEach((f,i) => f.rotation.z = (i ? 1 : -1) * (0.15 + (0.5 + 0.5*Math.sin(t*6)) * 0.4 * k));
};

const player = new THREE.Group();
const mount = new THREE.Group(); player.add(mount);
// モード0：牛の上にペンギン
const cowA = makeCow(), pengA = makePenguin();
pengA.root.position.set(0,1.76,-0.1); cowA.root.add(pengA.root);
// モード1：大きいペンギンの上に小さい牛
const pengB = makePenguin(), cowB = makeCow();
pengB.root.scale.setScalar(2.6);
cowB.root.scale.setScalar(0.17); cowB.root.position.set(0,0.98,-0.02); pengB.root.add(cowB.root);
mount.add(cowA.root, pengB.root);
let mode = 0;
const setMode = m => { mode = m; cowA.root.visible = m === 0; pengB.root.visible = m === 1; };
setMode(location.search.includes('p1') ? 1 : 0);
// 影
const shadowTex = (() => { const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,'rgba(0,0,0,.85)'); r.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=r; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3,4), new THREE.MeshBasicMaterial({ map:shadowTex, transparent:true, depthWrite:false }));
shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.05; player.add(shadow);
player.scale.setScalar(1.4);
scene.add(player);

// ---------- 木・岩 ----------
const leaf = new THREE.MeshLambertMaterial({ color:0x3f6b3a });
const bark = new THREE.MeshLambertMaterial({ color:0x2b241c });
for (let i=0;i<26;i++){
  const t = new THREE.Group();
  const x=(Math.random()-0.5)*60, z=(Math.random()-0.5)*60;
  if (Math.hypot(x,z) < 6) continue;
  t.position.set(x,0,z);
  t.add(box(0.4,3,0.4, bark, 0,1.5,0));
  for (let j=0;j<4;j++){
    const f = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2+Math.random()*0.6,0), leaf);
    f.position.set((Math.random()-0.5)*1.4, 3+Math.random()*1.6, (Math.random()-0.5)*1.4);
    t.add(f);
  }
  scene.add(t);
}

// ---------- 石碑（コンテンツの入口） ----------
const stoneMat = new THREE.MeshLambertMaterial({ color:0xbfc4b8, emissive:0x1a1d18 });
const labels = [];
for (const s of SPOTS){
  const m = box(1.2,2.6,0.5, stoneMat, s.pos[0],1.3,s.pos[1]);
  m.rotation.y = Math.random()*0.6-0.3;
  scene.add(m);
  const el = document.createElement('div'); el.className='label'; el.textContent=`[ ${s.key} ]`;
  document.body.appendChild(el);
  labels.push({ s, el, anchor:new THREE.Vector3(s.pos[0],3.2,s.pos[1]) });
}

// ---------- 漂う光（動画の o や * の粒） ----------
const motes = (() => {
  const n=400, a=new Float32Array(n*3);
  for (let i=0;i<n;i++){ a[i*3]=(Math.random()-0.5)*60; a[i*3+1]=0.5+Math.random()*4; a[i*3+2]=(Math.random()-0.5)*60; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(a,3));
  const p=new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:0.12 }));
  scene.add(p); return p;
})();

// ---------- ASCII 変換パス ----------
const CHARS = ' .,:-=+*oxQ0#%&@';
const atlas = (() => {
  const cw=32, ch=48, c=document.createElement('canvas'); c.width=cw*CHARS.length; c.height=ch;
  const g=c.getContext('2d'); g.fillStyle='#000'; g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#fff'; g.font='bold 40px Menlo, monospace'; g.textAlign='center'; g.textBaseline='middle';
  [...CHARS].forEach((ch_,i)=>g.fillText(ch_, i*cw+cw/2, ch/2+2));
  const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; return t;
})();
let rt = new THREE.WebGLRenderTarget(1,1);
const asciiMat = new THREE.ShaderMaterial({
  uniforms: { tScene:{value:null}, tGlyph:{value:atlas}, uRes:{value:new THREE.Vector2()},
              uCell:{value:new THREE.Vector2(7*DPR, 11*DPR)}, uCount:{value:CHARS.length} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:/* glsl */`
    uniform sampler2D tScene, tGlyph; uniform vec2 uRes, uCell; uniform float uCount;
    void main(){
      vec2 cell = floor(gl_FragCoord.xy / uCell);
      vec3 col = texture2D(tScene, (cell + 0.5) * uCell / uRes).rgb;
      float lum = dot(col, vec3(0.299,0.587,0.114));
      float idx = floor(clamp(pow(lum, 0.75) * 1.25, 0.0, 0.999) * uCount);
      vec2 local = fract(gl_FragCoord.xy / uCell);
      float g = texture2D(tGlyph, vec2((idx + local.x) / uCount, local.y)).r;
      vec3 tint = normalize(col + 1e-3) * 0.6 + 0.55;
      gl_FragColor = vec4(tint * g * (0.35 + lum * 1.6), 1.0);
    }`
});
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), asciiMat));
let asciiOn = !location.search.includes('raw');

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  const w = innerWidth*DPR, h = innerHeight*DPR;
  rt.setSize(w,h); asciiMat.uniforms.uRes.value.set(w,h);
}
addEventListener('resize', resize); resize();

// ---------- 入力 ----------
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); if (e.key.toLowerCase()==='t') asciiOn=!asciiOn; if (e.key.toLowerCase()==='p') setMode(1-mode); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
let pointer = null;
renderer.domElement.addEventListener('pointerdown', e => pointer = { x:e.clientX, y:e.clientY });
addEventListener('pointermove', e => { if (pointer) { pointer.x=e.clientX; pointer.y=e.clientY; } });
addEventListener('pointerup', () => pointer = null);

// ---------- パネル ----------
const panel = document.getElementById('panel');
let openKey = null;
function showPanel(s){
  if (openKey === s?.key) return;
  openKey = s?.key ?? null;
  if (!s) { panel.classList.remove('open'); return; }
  panel.querySelector('h2').textContent = s.key;
  panel.querySelector('p').textContent = s.text;
  panel.classList.add('open');
}
const flat = document.getElementById('flat');
flat.innerHTML = SPOTS.map(s=>`<section><h2>${s.key}</h2><p>${s.text}</p></section>`).join('');
document.getElementById('skip').onclick = () => {
  const open = flat.classList.toggle('open');
  document.getElementById('skip').textContent = open ? 'ゲームに戻る' : '普通に見る';
};

// ---------- ループ ----------
camera.position.set(0,8.5,7.5); camera.lookAt(0,1,0);
const clock = new THREE.Clock();
const vel = new THREE.Vector3(); let heading = -Math.PI/2, gait = 0;
const tmp = new THREE.Vector3();
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  // 移動入力（カメラ基準：画面上 = -z）
  const dir = new THREE.Vector2(
    (keys.has('d')||keys.has('arrowright')) - (keys.has('a')||keys.has('arrowleft')),
    (keys.has('s')||keys.has('arrowdown')) - (keys.has('w')||keys.has('arrowup')));
  if (pointer) dir.set(pointer.x - innerWidth/2, pointer.y - innerHeight/2);
  if (dir.lengthSq() > 0) dir.normalize();
  const speed = 6;
  vel.x += (dir.x*speed - vel.x) * Math.min(1, dt*6);
  vel.z += (dir.y*speed - vel.z) * Math.min(1, dt*6);
  player.position.addScaledVector(vel, dt);
  player.position.x = THREE.MathUtils.clamp(player.position.x, -30, 30);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -30, 30);
  const sp = Math.hypot(vel.x, vel.z);
  if (sp > 0.3) {
    const target = Math.atan2(vel.x, vel.z);
    let d = target - heading; d = Math.atan2(Math.sin(d), Math.cos(d));
    heading += d * Math.min(1, dt*8);
  }
  mount.rotation.y = heading;
  gait += sp * dt * 2.2;
  const k = Math.min(1, sp/3);
  mount.position.y = Math.abs(Math.sin(gait)) * 0.08 * k;
  if (mode === 0){
    animCow(cowA, gait, k, t);
    animPenguin(pengA, gait, k*0.5, t);
    pengA.root.rotation.y = Math.sin(t*0.7) * 0.4;           // きょろきょろ
  } else {
    animPenguin(pengB, gait*1.6, k, t);
    animCow(cowB, 0, 0, t);
    cowB.root.rotation.y = Math.sin(t*0.5) * 0.6;
  }

  grassMat.uniforms.uTime.value = t;
  grassMat.uniforms.uPlayer.value.copy(player.position);
  motes.position.y = Math.sin(t*0.5)*0.3;

  // カメラ追従（斜め上から見下ろし）
  tmp.set(player.position.x, 8.5, player.position.z + 7.5);
  camera.position.lerp(tmp, Math.min(1, dt*3));
  camera.lookAt(player.position.x, 1, player.position.z);

  // ラベルと近接判定
  let near = null;
  for (const L of labels){
    const p = L.anchor.clone().project(camera);
    L.el.style.display = p.z < 1 ? '' : 'none';
    L.el.style.left = `${(p.x*0.5+0.5)*innerWidth}px`;
    L.el.style.top  = `${(-p.y*0.5+0.5)*innerHeight}px`;
    if (Math.hypot(player.position.x - L.s.pos[0], player.position.z - L.s.pos[1]) < 3.5) near = L.s;
  }
  showPanel(near);

  if (asciiOn){
    renderer.setRenderTarget(rt); renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    asciiMat.uniforms.tScene.value = rt.texture;
    renderer.render(quadScene, quadCam);
  } else {
    renderer.setRenderTarget(null); renderer.render(scene, camera);
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
